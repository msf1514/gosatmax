  <script>
    const app=document.querySelector('#app');
    const state={mode:'entry',userType:null,step:0,tab:'home',overlay:null,route:null,prefTab:0,earnAreas:['Bills'],earnOn:'Bills',asset:'Gold',spend:'₹20k–₹50k',wallet:'Sats',cohort:'A',gender:'Male',historyRange:'This month',selectedBrand:'',info:null,nudgeHidden:false,opportunityType:'food',opportunityDetailsOpen:false,kycPending:true,cardBalanceVisible:false,rewardsVisible:false,toast:''};

    function header(title){const name=state.cohort==='A'?'Mohammed':'Aisha';return `<header class="header"><div class="header-title">${title||`Good Evening, ${name}`}</div><div class="header-actions"><button class="icon-button wheel" data-action="spinner" aria-label="Daily spinner">${M('tire_repair')}</button><button class="icon-button" data-action="profile" aria-label="Profile">${M('person')}</button></div></header>`}
    const navs=[['home','home','Home'],['brands','confirmation_number','Brands'],['grow','currency_bitcoin','Get More'],['rewards','redeem','Rewards'],['history','history','History']];
    function kycCta(){if(!state.kycPending||state.userType!=='new')return'';return `<button class="kyc-fab ${state.tab==='home'?'awaiting-visibility':''}" data-action="kyc" aria-label="Complete pending Video KYC">${M('videocam')}</button>`}
    function nav(){return `${kycCta()}<nav class="bottom-nav">${navs.map(([id,icon,label])=>`<button class="nav ${id==='grow'?'grow':''} ${state.tab===id?'active':''}" data-tab="${id}" ${id==='grow'?`aria-label="Get More with Max in ${state.asset}"`:''}>${id==='grow'?`<span class="nav-coin ${state.asset.toLowerCase()}"><span class="ai-mark">${M('auto_awesome')}</span><span class="asset-mark">${M(state.asset==='Gold'?'monetization_on':'currency_bitcoin')}</span></span>`:M(icon)}<span>${label}</span></button>`).join('')}</nav>`}
    function entryScreen(){return `<section class="screen entry">${status()}<div class="entry-body"><div class="entry-logo">GO<span>SATS</span></div><div class="entry-visual dual-rewards" aria-label="Earn both Gold and Bitcoin rewards with GoSats"><img class="entry-dual-image" src="gosats-assets/entry_dual_rewards_v3.png" alt="Illustrated Gold and Bitcoin reward badges"></div><div class="entry-copy"><h1>Turn everyday spending into something more.</h1><p>Earn Gold or Bitcoin rewards, understand every credit and find eligible opportunities from the spending you already do.</p></div><div class="entry-actions"><button class="continue" data-start="new">New User</button><button class="existing" data-start="existing">Existing User</button></div><div class="entry-note">Secure card, bill and rewards experience</div></div></section>`}
    function existingScreen(){return `<section class="screen">${status()}<div class="page-header"><button class="back" data-action="entry">${M('arrow_back_ios_new')}</button></div><div class="existing-body"><h1>Welcome back</h1><p>Choose an account to continue.</p><button class="profile-choice" data-cohort="A"><div class="profile-choice-top"><div class="avatar">M</div><div><strong>Mohammed</strong><small>Gold rewards</small></div><span class="cohort-tag">Continue</span></div><p>Recent activity includes registered bills, rent and recurring card payments.</p></button><button class="profile-choice bitcoin" data-cohort="B"><div class="profile-choice-top"><div class="avatar">A</div><div><strong>Aisha</strong><small>Bitcoin rewards</small></div><span class="cohort-tag">Continue</span></div><p>Recent activity includes food, brand vouchers and card payments.</p></button></div></section>`}
    function applyCohort(cohort){state.cohort=cohort;state.nudgeHidden=false;if(cohort==='A'){state.earnAreas=['Bills','Subscriptions'];state.earnOn='Bills';state.asset='Gold';state.wallet='Gold'}else{state.earnAreas=['Food','Shopping'];state.earnOn='Food';state.asset='Bitcoin';state.wallet='Sats'}}
    function ticket(brand,reward,color=''){return `<button class="ticket ${color}" data-action="brand-offer" data-brand="${brand}" aria-label="Open ${brand} reward offer"><div class="ticket-logo">${brand}</div><div class="ticket-reward">${reward}</div></button>`}
    function cardWidget(){const name=state.cohort==='A'?'MOHAMMED SUFIYAN':'AISHA KHAN';return `<div class="card-area"><div class="elite-card"><div class="brand-mark"><b>GO</b><em>SATS</em></div><div class="chip"></div><div class="card-name">${name}</div><div class="card-issuer">Issued by LivQuik Technology (India) Pvt Ltd</div><div class="visa">VISA</div></div><div class="card-tools"><button class="card-tool" data-action="card-physical">${M('credit_card')}<span>Get Physical<br>Card</span></button><button class="card-tool" data-action="card-details">${M('pin')}<span>Show Card<br>details</span></button><button class="card-tool" data-action="profile">${M('settings')}<span>Settings</span></button></div></div><div class="balance-row"><div class="balance"><strong>₹0</strong><span>Card Balance</span></div><button class="add-button" data-action="add-money">Add Money</button></div>`}
    function bills(){const items=[['credit_card','Credit Card'],['home','Rent'],['smartphone','Postpaid'],['bolt','Electricity'],['local_parking','FASTag'],['water_drop','Water']];return `<section class="bill-panel"><div class="section-head"><h3>Pay Your Bills</h3><button class="see-all" data-tab="grow">View All</button></div><div class="bill-list">${items.map(([icon,label])=>`<button class="bill" data-route="Bills & utilities" aria-label="Open ${label} payment route"><div class="bill-icon">${M(icon)}</div>${label}</button>`).join('')}</div></section>`}
    function earningCard(){const a=state.cohort==='A';if(state.nudgeHidden)return `<article class="earning-card"><div class="earning-top"><div class="earning-badge">${M('check')}</div><div><b style="font-size:10px">Hidden for now</b><div style="font-size:7px;color:#888">We’ll show a different way to earn next time</div></div></div></article>`;return `<article class="earning-card"><div class="earning-top"><div class="earning-badge">${M('auto_awesome')}</div><div><b style="font-size:10px">${a?'You can earn more':'A better reward route'}</b><div style="font-size:7px;color:#888">From spending already in your activity</div></div></div><h3>${a?'Get rewards on a payment you already make':'Get Bitcoin on your next food order'}</h3><p>${a?'We found a ₹499 monthly payment. Check whether the next one can earn Gold.':'You used the same food app twice last month. An eligible voucher may earn more next time.'}</p><div class="proof"><span>${a?'Monthly payment':'Repeat food spend'}</span><span>${a?'Up to ₹12 in Gold':'Up to ₹86 in Bitcoin'}</span></div><div class="earning-actions"><button class="primary" data-action="evidence">${a?'See how to earn':'See the better way'}</button><button class="quiet" data-action="hide-nudge">Not now</button></div></article>`}

    function home(){const a=state.cohort==='A',isNew=state.userType==='new';const brandBlock=`<div class="section-head"><h3>${a?'Top Brands':'Brands for repeat spends'}</h3><button class="see-all" data-tab="brands">View All</button></div><div class="tickets">${a?ticket('amazon','1.2% Rewards','cream')+ticket('PVR','8% Rewards','cream')+ticket('SWIGGY','2% Rewards','pink')+ticket('prime','15% Rewards'):ticket('SWIGGY','2% Rewards','pink')+ticket('ZOMATO','1.5% Rewards','pink')+ticket('PVR','8% Rewards','cream')+ticket('amazon','1.2% Rewards','cream')}</div>`;const more=`<button class="earn-more-strip" data-tab="grow"><span class="earn-coin"><b style="font-size:17px">₿+</b></span><span><strong>Know how much more ${state.asset} you can earn</strong><small>${a?'From card spends, rent, postpaid and registered bills':'From repeat food spends, vouchers and card payments'}</small></span>${M('chevron_right')}</button>`;const middle=a?`${bills()}${more}${brandBlock}`:`${brandBlock}${more}${bills()}`;const assetPromo=a?`<img class="gold-banner" src="gosats-assets/gold_daily.png" alt="Invest in gold daily">`:`<article class="smart-hero" style="margin-top:23px;background:linear-gradient(110deg,#1f1a13,#3a2508);color:#fff"><div class="smart-kicker" style="color:var(--gold)">₿ BITCOIN REWARDS</div><h2>Stack Bitcoin from repeat spends.</h2><p style="color:#aaa">Keep every eligible reward in Sats.</p><button class="hero-link" data-tab="rewards">View Sats</button></article>`;const firstFold=isNew?`<section class="new-welcome"><small>Your Elite Card is ready</small><h1>Turn your next payment into ${state.asset}.</h1><p>Start with a bill, rent, card spend or eligible brand voucher.</p></section>${newFirstAction()}`:`<section class="total"><div class="total-label">Total Rewards</div><div class="total-value">${a?'₹436':'₹728'}</div><button class="total-link" data-tab="history">Rewards Breakdown ${M('chevron_right')}</button></section>${earningCard()}`;const plan=`<article class="smart-hero" style="margin-top:23px"><div class="smart-kicker">${M('auto_awesome')} MAX · YOUR GOSATS PLANNER</div><h2>${isNew?'Let Max build your first monthly plan.':'₹642 a month could be within reach.'}</h2><p>${isNew?'Based on the spend range and categories you selected.':'Let Max map your usual spending to better reward routes.'}</p><button class="hero-link" data-action="plan">${isNew?'Build my plan':'See my plan'}</button></article>`;return `<section class="screen">${status()}${header(isNew?'Welcome to GoSats':undefined)}<div class="scroll">${firstFold}${isNew?plan:''}${isNew||a?`<img class="kyc-banner" data-action="kyc" role="button" tabindex="0" src="gosats-assets/kyc_banner.png" alt="Complete Video KYC to unlock your monthly spend limit" style="margin-top:16px">`:''}${cardWidget()}${middle}${isNew?'':plan}${assetPromo}<div class="bottom-spacer"></div></div>${nav()}${overlay()}${toast()}</section>`}

    function decorateEvidenceSheet(){if(state.overlay!=='evidence')return;const sheet=app.querySelector('.backdrop .sheet');if(!sheet)return;sheet.classList.add('opportunity-sheet');const a=state.cohort==='A',alt=state.opportunityType===(a?'bill':'travel'),title=sheet.querySelector('h2'),intro=sheet.querySelector(':scope>p'),hero=sheet.querySelector('.opportunity-hero'),steps=[...sheet.querySelectorAll('.friendly-step')];if(alt&&!a){title.textContent='Earn Bitcoin on your next trip';intro.textContent='Planning travel? Check GoSats before booking to compare eligible travel rewards.';hero.querySelector('.opportunity-icon').innerHTML=M('flight');hero.querySelector('small').textContent='AVAILABLE ON ELIGIBLE TRAVEL PARTNERS';hero.querySelector('strong').textContent='Earn Bitcoin on an eligible booking';const copy=[['Choose a travel partner','Compare Air India, AirHelp and EaseMyTrip offers.'],['Book through GoSats','See the eligible reward before payment.'],['Receive Bitcoin','Eligible rewards are added in Sats.']];steps.forEach((step,i)=>{step.querySelector('span').innerHTML=M(['travel_explore','payments','redeem'][i]);step.querySelector('strong').textContent=copy[i][0];step.querySelector('small').textContent=copy[i][1]})}else if(alt&&a){title.textContent='Earn Gold on your next bill';intro.textContent='Choose an eligible electricity, water or postpaid bill and see the Gold reward before paying.';hero.querySelector('.opportunity-icon').innerHTML=M('receipt_long');hero.querySelector('small').textContent='AVAILABLE ON ELIGIBLE BILL PAYMENTS';hero.querySelector('strong').textContent='Turn a regular bill into Gold rewards'}const label=alt?(a?'Show Me Bill Options':'Show Me Travel Offers'):(a?'Show My Options':'Show Me Food Offers');sheet.querySelector('.sheet-actions').innerHTML=`<button class="continue" data-action="eligibility">${label}</button><div class="opportunity-choice-row"><button class="opportunity-choice dismiss" data-action="hide-nudge">${M('close')}<strong>Not     function rebuildOpportunitySheet(){if(state.overlay!=='evidence')return;const sheet=app.querySelector('.backdrop .sheet');if(!sheet)return;const a=state.cohort==='A',alt=state.opportunityType===(a?'bill':'travel');let d;if(a&&!alt)d={icon:'subscriptions',eyebrow:'REPEAT PAYMENT FOUND',merchant:'Netflix',amount:'₹499',title:'Make your ₹499 Netflix payment earn Gold',intro:'You already pay this every month. An eligible GoSats route could turn the same payment into a Gold reward.',rate:'Up to 2% back',reward:`${assetReward(10)} · worth ≈₹10`,year:'About ₹120 in a year across 12 eligible payments',cta:'Show My Eligible Route',swap:'Show a bill instead',swapHint:'Try another regular payment'};else if(a)d={icon:'bolt',eyebrow:'REGULAR BILL OPPORTUNITY',merchant:'Electricity bill',amount:'₹1,850',title:'Make your ₹1,850 electricity bill earn Gold',intro:'This bill is already part of your month. An eligible GoSats payment route could make it more rewarding.',rate:'Up to 1.5% back',reward:`${assetReward(28)} · worth ≈₹28`,year:'About ₹336 in a year across 12 eligible bills',cta:'Show Me Bill Options',swap:'Show Netflix instead',swapHint:'Return to the repeat payment'};else if(!alt)d={icon:'restaurant',eyebrow:'NEXT SPEND OPPORTUNITY',merchant:'Food order',amount:'₹499',title:'Make your next ₹499 food order earn Bitcoin',intro:'The price stays the same. An eligible GoSats voucher could add Bitcoin to a purchase you already plan to make.',rate:'Up to 2% back',reward:`${assetReward(10)} · worth ≈₹10`,year:'About ₹120 across 12 eligible food orders',cta:'Show Me Food Offers',swap:'Show travel instead',swapHint:'Try a different category'};else d={icon:'flight',eyebrow:'TRAVEL OPPORTUNITY',merchant:'Travel booking',amount:'₹6,500',title:'Make your ₹6,500 travel booking earn Bitcoin',intro:'Compare an eligible GoSats travel route before you book and keep the reward in Sats.',rate:'Up to ₹86 back',reward:`${assetReward(86)} · worth ≈₹86`,year:'A visible reward on a trip you already plan to take',cta:'Show Me Travel Offers',swap:'Show food instead',swapHint:'Return to food offers'};sheet.className='sheet opportunity-sheet comparison-sheet';sheet.innerHTML=`<div class="grab"></div><div class="opportunity-heading"><span class="opportunity-context-icon">${M(d.icon)}</span><span><small>${d.eyebrow}</small><strong>${d.merchant}</strong></span></div><h2>${d.title}</h2><p>${d.intro}</p><div class="payment-compare"><article class="compare-card current"><small>PAY DIRECTLY</small><strong>${d.amount}</strong><span>Same monthly payment</span><em>₹0 rewards</em></article><span class="compare-arrow">${M('arrow_forward')}</span><article class="compare-card gosats"><small>PAY WITH GOSATS</small><strong>${d.amount}</strong><span>Same monthly payment</span><em>${d.rate}</em><b>${d.reward}</b></article></div><div class="reward-horizon">${M('calendar_month')}<span><small>REWARD POTENTIAL</small><strong>${d.year}</strong></span></div><details class="how-details"><summary><span>${M('info')} How this works</span><span class="material-symbols-rounded details-chevron">expand_more</span></summary><div class="how-accordion"><div class="how-step"><span>${M('search')}</span><div><strong>Choose the matching eligible route</strong><small>We show the option and reward before you pay.</small></div></div><div class="how-step"><span>${M('payments')}</span><div><strong>Pay the same amount through GoSats</strong><small>Your ${d.amount} payment does not change.</small></div></div><div class="how-step"><span>${M('redeem')}</span><div><strong>Receive ${state.asset}</strong><small>The eligible reward is added after payment.</small></div></div></div></details><div class="sheet-actions"><button class="continue" data-action="eligibility">${d.cta}</button><div class="opportunity-choice-row"><button class="opportunity-choice dismiss" data-action="hide-nudge">${M('close')}<strong>Not for me</strong><small>Hide this suggestion</small></button><button class="opportunity-choice" data-action="another-opportunity">${M('swap_horiz')}<strong>${d.swap}</strong><small>${d.swapHint}</small></button></div></div>`}
    function render(){if(kycObserver){kycObserver.disconnect();kycObserver=null}let html;if(state.mode==='entry')html=entryScreen();else if(state.mode==='existing')html=existingScreen();else if(state.mode==='onboarding')html=flowSteps[state.step]();else if(state.mode==='profile')html=profile();else if(state.mode==='kyc')html=kycPage();else{const pages={home,brands:state.route?focusedBrands:brands,grow:getMore,rewards,history};html=pages[state.tab]()}app.innerHTML=html;enforceKycVisibility();decorateExistingHome();decorateGetMore();decorateBrands();rebuildOpportunitySheet();decoratePlanSheet();syncKycCta()}
    function showToast(message){state.toast=message;render();setTimeout(()=>{state.toast='';render()},1800)}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-tab],[data-wallet],[data-earn],[data-spend],[data-asset],[data-profile-asset],[data-pref],[data-start],[data-cohort],[data-route],[data-brand-focus],[data-gender]');if(!el)return;
      if(el.dataset.start){state.cardBalanceVisible=false;state.rewardsVisible=false;if(el.dataset.start==='new'){state.userType='new';state.kycPending=true;state.mode='onboarding';state.step=0;state.prefTab=0;state.earnOn='Bills';state.asset='Gold';state.spend='₹20k–₹50k';applyCohort('A')}else{state.userType='existing';state.kycPending=false;state.mode='existing'}render();return}
      if(el.dataset.cohort){state.userType='existing';state.kycPending=false;state.cardBalanceVisible=false;state.rewardsVisible=false;applyCohort(el.dataset.cohort);state.mode='app';state.tab='home';render();return}
      if(el.dataset.tab){state.mode='app';state.tab=el.dataset.tab;state.overlay=null;if(el.dataset.tab==='brands')state.route=null;render();return}
      if(el.dataset.route){state.route=el.dataset.route;state.overlay='route';render();return}
      if(el.dataset.brandFocus){state.route=el.dataset.brandFocus;state.overlay=null;state.mode='app';state.tab='brands';render();return}
      if(el.dataset.wallet){state.wallet=el.dataset.wallet;render();return}
      if(el.dataset.earn){const area=el.dataset.earn;const selected=state.earnAreas.includes(area);if(selected&&state.earnAreas.length>1)state.earnAreas=state.earnAreas.filter(item=>item!==area);else if(!selected)state.earnAreas=[...state.earnAreas,area];state.earnOn=state.earnAreas[0];render();return}
      if(el.dataset.spend){state.spend=el.dataset.spend;render();return}
      if(el.dataset.asset){state.asset=el.dataset.asset;render();return}
      if(el.dataset.profileAsset){state.asset=el.dataset.profileAsset;state.wallet=state.asset==='Gold'?'Gold':'Sats';render();return}
      if(el.dataset.gender){state.gender=el.dataset.gender;render();return}
      if(el.dataset.pref!==undefined){state.prefTab=Number(el.dataset.pref);render();return}
      const a=el.dataset.action;
      if(a==='next-flow'){if(state.step===7&&state.prefTab===0){state.prefTab=1}else if(state.step===7&&state.prefTab===1){state.cohort=(state.asset==='Bitcoin'||state.earnAreas.some(area=>['Food','Shopping','Travel'].includes(area)))?'B':'A';state.wallet=state.asset==='Gold'?'Gold':'Sats';state.nudgeHidden=false;state.step++}else if(state.step<flowSteps.length-1){state.step++}else{state.mode='app';state.tab='home';state.toast=''}render();return}
      if(a==='back-flow'){if(state.step===7&&state.prefTab===1){state.prefTab=0}else if(state.step>0){state.step--}else{state.mode='entry'}render();return}
      if(a==='skip-flow'){if(state.step===7){state.cohort=(state.asset==='Bitcoin'||state.earnAreas.some(area=>['Food','Shopping','Travel'].includes(area)))?'B':'A';state.wallet=state.asset==='Gold'?'Gold':'Sats';state.step=8}else if(state.step<flowSteps.length-1)state.step++;else{state.mode='app';state.tab='home'}render();return}
      if(a==='profile'){state.mode='profile';state.overlay=null;render();return}
      if(a==='close-profile'){state.mode='app';render();return}
      if(a==='close-kyc'){state.mode='app';render();return}
      if(a==='entry'||a==='logout'){state.mode='entry';state.userType=null;state.step=0;state.prefTab=0;state.toast='';render();return}
      if(a==='view-cohorts'){state.mode='existing';render();return}
      if(a==='evidence'){state.opportunityType=state.cohort==='A'?'payment':'food';state.opportunityDetailsOpen=false;state.overlay='evidence'}
      if(a==='plan'){if(el.classList.contains('grow-summary')){state.overlay='estimate';render();return}state.overlay='plan-loading';render();setTimeout(()=>{if(state.overlay==='plan-loading'){state.overlay='plan';render()}},1450);return}
      if(a==='reward-detail')state.overlay='reward';
      if(a==='chat')state.overlay='chat';
      if(a==='planner-chat')state.overlay='planner-chat';
      if(a==='kyc'){state.mode='kyc';state.overlay=null;render();return}
      if(a==='spinner')state.overlay='spinner';
      if(a==='close-overlay'){state.overlay=null;state.info=null}
      if(a==='hide-nudge'){state.nudgeHidden=true;state.overlay=null;showToast('Suggestion hidden. Your feed will adapt.');return}
      if(a==='reveal-card'){state.cardBalanceVisible=!state.cardBalanceVisible;render();return}
      if(a==='reveal-rewards'){state.rewardsVisible=!state.rewardsVisible;render();return}
      if(a==='add-money'){state.info={icon:'account_balance_wallet',title:'Add money to your Elite Card',copy:'Choose an amount and payment method before adding funds. No money is moved in this design preview.',cta:'Choose Amount',success:'Add Money amount selection opened.'};state.overlay='info';render();return}
      if(a==='card-physical'){state.info={icon:'credit_card',title:'Get your physical Elite Card',copy:'Confirm your delivery address and card fee before placing the request.',cta:'Review Delivery',success:'Physical card delivery details are ready.'};state.overlay='info';render();return}
      if(a==='card-details'){state.info={icon:'pin',title:'Your card details are protected',copy:'In the live app, app lock or device verification is required before the card number is revealed.',cta:'Verify to View',success:'Card verification step opened.'};state.overlay='info';render();return}
      if(a==='brand-offer'){state.selectedBrand=el.dataset.brand||'Brand';state.info={icon:'confirmation_number',title:`${state.selectedBrand} reward offer`,copy:`Review the eligible ${state.selectedBrand} voucher value and final ${state.asset} reward before paying.`,cta:'View Eligible Values',success:`${state.selectedBrand} eligible voucher values opened.`};state.overlay='info';render();return}
      if(a==='redeem'){const label=el.dataset.redeem||`Redeem ${state.wallet}`;state.info={icon:'redeem',title:label,copy:`Review the minimum balance, fees and destination before redeeming your available ${state.wallet}.`,cta:'Review Redemption',success:`${label} review opened.`};state.overlay='info';render();return}
      if(a==='profile-menu'){const label=el.dataset.label||'Profile';state.info={icon:'settings',title:label,copy:`View and manage your ${label.toLowerCase()} options here.`,cta:'Open Settings',success:`${label} opened.`};state.overlay='info';render();return}
      if(a==='info-primary'){const message=state.info?.success||'Done.';state.overlay=null;state.info=null;showToast(message);return}
      if(a==='brand-search'||a==='view-more-brands'){state.overlay='brand-filter';render();return}
      if(a==='history-filter'){state.historyRange=state.historyRange==='This month'?'Last 3 months':'This month';showToast(`Showing ${state.historyRange.toLowerCase()}.`);return}
      if(a==='another-opportunity'){state.opportunityType=state.cohort==='A'?(state.opportunityType==='bill'?'payment':'bill'):(state.opportunityType==='travel'?'food':'travel');state.opportunityDetailsOpen=false;render();return}
      if(a==='toggle-opportunity-details'){state.opportunityDetailsOpen=!state.opportunityDetailsOpen;render();return}
      if(a==='eligibility'){if(state.opportunityType==='travel'){state.overlay=null;state.mode='app';state.tab='brands';state.route='Travel payments';render();return}state.overlay='options';render();return}
      if(a==='best-route'){const best=monthlyPlanData().rows.reduce((top,row)=>row[3]>top[3]?row:top);state.route=best[1];state.overlay='route';render();return}
      if(a==='back-to-plan'){state.overlay='plan';render();return}
      if(a==='clear-brand-focus'){state.route=null;state.overlay=null;render();return}
      if(a==='brand-filter'){state.overlay='brand-filter';render();return}
      if(a==='open-brand-offers'){state.overlay=null;state.mode='app';state.tab='brands';showToast('Showing the most relevant eligible brands.');return}
      if(a==='open-bill-route'){state.overlay=null;state.mode='app';state.tab='home';showToast('Choose a bill to see its eligible reward.');return}
      if(a==='open-card-route'){state.overlay=null;state.mode='app';state.tab='home';showToast('Your Elite Card reward options are ready.');return}
      if(a==='begin-vkyc'){state.kycPending=false;state.overlay=null;state.mode='app';state.tab='home';showToast('Video KYC completed in this design preview. Full card limit unlocked.');return}
      if(a==='max-prompt'){showToast('Max is preparing a clear answer for you.');return}
      if(a==='spin-win'){state.overlay=null;showToast('You won 20 bonus Sats.');return}
      if(a==='toast'){showToast('This interaction is ready for the next product flow.');return}
      render();
    });
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kyc-banner[role="button"]')){e.preventDefault();e.target.click()}});
    render();
  </script>
